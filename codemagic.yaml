workflows:
  build-unsigned-ipa:
    name: Build unsigned IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        SCHEME: "Stash"
        BUNDLE_ID: "com.ares.stash"
    scripts:
      - name: Select Xcode 26 (SDK iOS 26 / Liquid Glass)
        script: |
          set -euo pipefail
          # Sélectionne le Xcode le plus récent disponible ; vise Xcode 26 si présent.
          XCODE_APP=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$XCODE_APP" ]; then
            echo "Xcode 26 introuvable sur cette machine. Xcode disponibles :"
            ls -d /Applications/Xcode*.app
            echo "Utilise le Xcode par défaut à la place."
            XCODE_APP=$(ls -d /Applications/Xcode.app 2>/dev/null || true)
          fi
          echo "Sélection de $XCODE_APP"
          sudo xcode-select -switch "$XCODE_APP"
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios || true

      - name: Generate app icon
        script: |
          set -euo pipefail
          swift Tools/generate_icon.swift \
            "Stash/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
          ls -lh "Stash/Assets.xcassets/AppIcon.appiconset/"

      - name: Build (no signing)
        script: |
          set -euo pipefail
          xcodebuild build \
            -project Stash.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/build/DerivedData" \
            ASSETCATALOG_COMPILER_STANDALONE_ICON_BEHAVIOR=all \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package unsigned .ipa
        script: |
          set -euo pipefail
          APP_PATH="$CM_BUILD_DIR/build/DerivedData/Build/Products/Release-iphoneos/Stash.app"
          OUTPUT_DIR="$CM_BUILD_DIR/build/ipa"
          if [ ! -d "$APP_PATH" ]; then
            echo "Stash.app introuvable à $APP_PATH"
            ls -R "$CM_BUILD_DIR/build/DerivedData/Build/Products" || true
            exit 1
          fi
          mkdir -p "$OUTPUT_DIR/Payload"
          cp -R "$APP_PATH" "$OUTPUT_DIR/Payload/"
          cd "$OUTPUT_DIR"
          zip -qry Stash-unsigned.ipa Payload
          rm -rf Payload
          echo "IPA créé :"
          ls -lh "$OUTPUT_DIR"
    artifacts:
      - build/ipa/Stash-unsigned.ipa
