workflows:
  build-unsigned-ipa:
    name: Build unsigned IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: 26.0.1
      vars:
        SCHEME: "Stash"
        BUNDLE_ID: "com.ares.stash"
    scripts:
      - name: Verify Xcode 26 (SDK iOS 26 / Liquid Glass requis)
        script: |
          set -euo pipefail
          # Codemagic sélectionne déjà Xcode via `environment: xcode: 26.0`.
          # On VÉRIFIE que c'est bien du Xcode 26 : l'app utilise des API iOS 26
          # (.glass / .glassProminent / .glassEffect) qui n'existent que dans le
          # SDK iOS 26. Compiler avec un Xcode plus ancien => erreurs CompileSwift.
          echo "Xcode sélectionné :"
          xcodebuild -version
          XCODE_MAJOR=$(xcodebuild -version | head -1 | sed -E 's/Xcode ([0-9]+).*/\1/')
          if [ "$XCODE_MAJOR" -lt 26 ]; then
            echo "ERREUR : Xcode $XCODE_MAJOR détecté, mais Xcode 26 est requis (SDK iOS 26)."
            echo "Change 'xcode: 26.0.1' dans codemagic.yaml pour une version 26.x disponible (ex. 26.0, 26.1)."
            echo "Versions Xcode présentes sur cette machine :"
            ls -d /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi
          echo "SDK iOS disponibles :"
          xcodebuild -showsdks | grep -i ios || true

      - name: Generate app icon
        script: |
          set -euo pipefail
          swift Tools/generate_icon.swift \
            "Stash/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
          ls -lh "Stash/Assets.xcassets/AppIcon.appiconset/"

      - name: Run unit tests
        script: |
          set -euo pipefail
          SIM_ID=$(xcrun simctl list devices available -j | jq -r '.devices[] | select(type=="array") | .[] | select(.name | contains("iPhone")) | .udid' | head -1)
          if [ -n "$SIM_ID" ]; then
            echo "Tests sur simulateur $SIM_ID"
            xcodebuild test \
              -project Stash.xcodeproj \
              -scheme "$SCHEME" \
              -destination "platform=iOS Simulator,id=$SIM_ID" \
              -derivedDataPath "$CM_BUILD_DIR/build/DerivedData"
          fi

      - name: Build (no signing)
        script: |
          set -euo pipefail
          xcodebuild build \
            -project Stash.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/build/DerivedData" \
            ASSETCATALOG_COMPILER_STANDALONE_ICON_BEHAVIOR=all \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package unsigned .ipa
        script: |
          set -euo pipefail
          APP_PATH="$CM_BUILD_DIR/build/DerivedData/Build/Products/Release-iphoneos/Stash.app"
          OUTPUT_DIR="$CM_BUILD_DIR/build/ipa"
          if [ ! -d "$APP_PATH" ]; then
            echo "Stash.app introuvable à $APP_PATH"
            ls -R "$CM_BUILD_DIR/build/DerivedData/Build/Products" || true
            exit 1
          fi
          mkdir -p "$OUTPUT_DIR/Payload"
          cp -R "$APP_PATH" "$OUTPUT_DIR/Payload/"
          cd "$OUTPUT_DIR"
          zip -qry Stash-unsigned.ipa Payload
          rm -rf Payload
          echo "IPA créé :"
          ls -lh "$OUTPUT_DIR"
    artifacts:
      - build/ipa/Stash-unsigned.ipa
